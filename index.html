<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="description" content="description goes here">
   <meta name="author" content="Jamie">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="/styles.css">
   <title>The Color Scheme</title>
</head>

<body>
   <div class="main-wrapper">
      <header>
         <h1>the <span class="color-1">C</span><span class="color-2">O</span><span class="color-3">L</span><span
               class="color-4">O</span><span class="color-5">R</span>
            scheme</h1>
      </header>
      <main>
         <section class="inputs">
            <input type="color" id="color-input" class="input" value="#d2fe6a">
            <select name="scheme-mode" id="scheme-mode" class="input">
               <option value="analogic">Analogic</option>
               <option value="analogic-complement">Analogic-Complement</option>
               <option value="complement">Complement</option>
               <option value="monochrome">Monochrome</option>
               <option value="monochrome-dark">Monochrome-Dark</option>
               <option value="monochrome-light">Monochrome-Light</option>
               <option value="triad">Triad</option>
            </select>
            <button id="generate" class="input">Get color scheme</button>
         </section>
         <section class="scheme-container">
            <div class="scheme-block">
               <div class="color-1 color-block"></div>
               <h2 id="hex1">#fe7b6a</h2>
            </div>
            <div class="scheme-block">
               <div class="color-2 color-block"></div>
               <h2 id="hex2">#febe6a</h2>
            </div>
            <div class="scheme-block">
               <div class="color-3 color-block"></div>
               <h2 id="hex3">#d2fe6a</h2>
            </div>
            <div class="scheme-block">
               <div class="color-4 color-block"></div>
               <h2 id="hex4">#6ad9fe</h2>
            </div>
            <div class="scheme-block">
               <div class="color-5 color-block"></div>
               <h2 id="hex5">#ec92fc</h2>
            </div>
         </section>
      </main>
   </div>
   <script type="module" src="/index.js"></script>
</body>

</html>
